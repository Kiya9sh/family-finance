<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>مدیریت مالی خانواده</title>
    <meta name="description" content="ثبت درآمد، هزینه، وام و پول قرضی خانواده به تومان با تقویم شمسی — آفلاین روی همین گوشی." />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="manifest" href="manifest.webmanifest" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="مالی خانواده" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="topbar__brand" id="brand">مدیریت مالی خانواده</span>
      <span class="topbar__today" id="today-chip"></span>
      <span class="topbar__pill" id="net-pill" hidden>آفلاین</span>
    </header>

    <main id="view" class="app-main" role="main"></main>

    <nav class="tabbar" id="tabbar" aria-label="بخش‌ها"></nav>

    <div id="sheet-root"></div>
    <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
    <div id="onboarding-root" hidden></div>

    <noscript>
      <div class="card" style="margin:16px">
        برای استفاده از این برنامه باید جاوااسکریپت در Safari روشن باشد.
      </div>
    </noscript>

    <div
      id="boot-error"
      hidden
      style="position:fixed;inset:0;z-index:90;overflow:auto;background:#f6f7f9;padding:18px;font-family:-apple-system,'SF Pro Text',Tahoma,sans-serif;color:#14212b;line-height:1.7"
    >
      <div style="max-width:520px;margin:0 auto;background:#fff;border-radius:16px;padding:18px">
        <h2 style="font-size:18px;margin:0 0 8px">برنامه بارگذاری نشد</h2>
        <p style="font-size:14px;color:#475569;margin:0 0 14px">
          فایل‌های برنامه به گوشی نرسیده‌اند یا نسخه‌ای نیمه‌کاره در حافظه مانده است.
          اتصال اینترنت را بررسی کنید و دوباره تلاش کنید.
        </p>
        <button
          type="button"
          onclick="location.reload()"
          style="width:100%;padding:14px;font-size:16px;font-weight:600;color:#fff;background:#0f766e;border:0;border-radius:14px"
        >
          تلاش دوباره
        </button>
        <a
          href="./reset.html"
          style="display:block;margin-top:12px;font-size:14px;color:#0f766e;text-align:center"
        >
          پاک کردن فایل‌های ذخیره‌شده برنامه
        </a>
        <p style="font-size:12px;color:#64748b;margin:14px 0 0">
          رکوردهای شما با این کار پاک نمی‌شوند.
        </p>
      </div>
    </div>

    <script>
      /* Runs on its own, without the app's modules: if they fail to load or
       * throw while starting, show a way out instead of a blank screen. */
      window.setTimeout(function () {
        if (window.__appBooted) return;
        var box = document.getElementById('boot-error');
        if (box) box.hidden = false;
      }, 8000);
    </script>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
