# Publishes the static app to GitHub Pages.
#
# The site is plain files, so the job copies them into _site (leaving out .git,
# .github and README) and hands that folder to actions/deploy-pages.
#
# For this to run, the repository's Settings -> Pages -> Source must be
# "GitHub Actions". Run it by hand from the Actions tab if you do not want to
# push a commit.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Collect the files to publish
        run: |
          set -e
          mkdir -p _site
          cp index.html styles.css sw.js manifest.webmanifest _site/
          cp -R icons js _site/
          find _site -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
